[project]
name = "a10-adc-monitor"
version = "0.1.0"
description = "A10 ADC 상태 점검 자동화"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "schedule>=1.2.2",
    "urllib3>=2.0.0",
]

[project.scripts]
a10-monitor = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
